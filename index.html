<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Little Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #4a90e2;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            padding: 25px;
            max-width: 800px;
            margin: auto;
        }

        .box {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4a90e2;
            color: white;
        }

        button:hover {
            background-color: #357abd;
        }

        footer {
            margin-top: 40px;
            background-color: #ddd;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Just a simple page I made</p>
    </header>

    <main>
        <div class="box">
            <h2>Hello</h2>
            <p>This is a small website I made while learning HTML and CSS. It’s nothing fancy, but it works and I’m proud of it 🙂</p>

            <h2>Stuff</h2>
            <p>I’m still learning how websites work. Next I want to add more pages and maybe some JavaScript.</p>

			<button onclick="alert('Wowwwwww!')">Click Me</button>
        </div>
    </main>

    <footer>
        <p>© 2026 SecretSauceSpiller</p>
    </footer>

</body>
</html>
